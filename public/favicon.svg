<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Soft Rounded Background Container with Forest Gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14463E"/>
      <stop offset="100%" stop-color="#0A2924"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Outer Subtle Gold Ring -->
  <rect x="2" y="2" width="60" height="60" rx="14" stroke="#D9C5B2" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- Happy Smiling Tooth -->
  <g transform="translate(12, 10)">
    <!-- Tooth Body -->
    <path 
      d="M20 4C13 4 8 8.5 8 15.5C8 23 10.5 32 14.5 36C16.5 38 18.5 35 20 31.5C21.5 35 23.5 38 25.5 36C29.5 32 32 23 32 15.5C32 8.5 27 4 20 4Z" 
      fill="#FFFFFF" 
      stroke="#FAF8F5" 
      stroke-width="1.5" 
      stroke-linejoin="round"
    />
    
    <!-- Happy Cheerful Eyes -->
    <circle cx="15" cy="14" r="2" fill="#0A2924"/>
    <circle cx="25" cy="14" r="2" fill="#0A2924"/>
    
    <!-- Catchlight in eyes -->
    <circle cx="15.6" cy="13.4" r="0.7" fill="#FFFFFF"/>
    <circle cx="25.6" cy="13.4" r="0.7" fill="#FFFFFF"/>

    <!-- Cute Rosy Cheeks -->
    <ellipse cx="12.5" cy="18" rx="2" ry="1.2" fill="#E94B77" fill-opacity="0.4"/>
    <ellipse cx="27.5" cy="18" rx="2" ry="1.2" fill="#E94B77" fill-opacity="0.4"/>

    <!-- Wide Happy Smile with Teeth -->
    <path 
      d="M14 20C14 24.5 17 26.5 20 26.5C23 26.5 26 24.5 26 20Z" 
      fill="#0A2924"
    />
    <path 
      d="M15 20H25C25 21.8 23 22.5 20 22.5C17 22.5 15 21.8 15 20Z" 
      fill="#FFFFFF"
    />

    <!-- Sparkle Stars -->
    <path 
      d="M32 6L33 9L36 10L33 11L32 14L31 11L28 10L31 9Z" 
      fill="#D9C5B2"
    />
  </g>
</svg>
