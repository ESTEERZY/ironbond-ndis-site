<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Rounded Square Container with Deep Forest Background -->
  <rect width="64" height="64" rx="16" fill="#0F3832"/>
  
  <!-- Subtle Inner Border -->
  <rect x="2" y="2" width="60" height="60" rx="14" stroke="#D9C5B2" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- Elegant Tooth & Harbour Wave Motif -->
  <g transform="translate(12, 11)">
    <!-- Tooth Contour -->
    <path 
      d="M20 5C13.5 5 9 9.5 9 16C9 23 11.5 31.5 15 35C17 37 19 34.5 20 31C21 34.5 23 37 25 35C28.5 31.5 31 23 31 16C31 9.5 26.5 5 20 5Z" 
      fill="#FAF8F5" 
      fill-opacity="0.15" 
      stroke="#FAF8F5" 
      stroke-width="2.5" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />
    <!-- Harbour Gentle Smile Wave -->
    <path 
      d="M13 18C16 21 24 21 27 18" 
      stroke="#D9C5B2" 
      stroke-width="2.5" 
      stroke-linecap="round"
    />
    <!-- Subtle Sparkle Accent -->
    <circle cx="20" cy="11" r="2" fill="#D9C5B2"/>
  </g>
</svg>
